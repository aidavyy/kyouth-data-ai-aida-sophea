[project]
name = "kyouth-week3-frontend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
	"fastapi==0.136.3",
	"jinja2==3.1.6",
	"uvicorn[standard]>=0.23.0,<1.0.0",
	"python-dotenv==1.0.0",
	"ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

