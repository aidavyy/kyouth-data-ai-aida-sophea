<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    body {
      min-height: 100vh;
      background: #f8fafc;
      font-family: Inter, system-ui, sans-serif;
    }
    .chat-shell {
      max-width: 960px;
      margin: 2rem auto;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      background: white;
    }
    .chat-header {
      background: #2563eb;
      color: white;
    }
    .chat-history {
      height: 60vh;
      overflow-y: auto;
      padding: 1.5rem;
      background: #f8fafc;
    }
    .chat-message {
      margin-bottom: 1rem;
      max-width: 75%;
      word-break: break-word;
    }
    .chat-message.user {
      margin-left: auto;
      background: #2563eb;
      color: white;
      border-radius: 1rem 1rem 0.5rem 1rem;
      padding: 1rem;
    }
    .chat-message.bot {
      margin-right: auto;
      background: #e2e8f0;
      color: #0f172a;
      border-radius: 1rem 1rem 1rem 0.5rem;
      padding: 1rem;
    }
    .chat-footer {
      padding: 1.25rem;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="chat-shell shadow-sm">
    <div class="chat-header p-4">
      <div class="d-flex justify-content-between align-items-center gap-3 flex-column flex-md-row">
        <div>
          <h1 class="h3 mb-1">Resume Helper Chatbot</h1>
          <p class="mb-0 text-white-75">Ask questions or upload a resume PDF to include context.</p>
        </div>
      </div>
    </div>

    <div id="chatHistory" class="chat-history" aria-live="polite"></div>

    <div class="chat-footer border-top">
      <form id="chatForm" class="row g-3">
        <div class="col-12 col-lg-6">
          <label for="userInput" class="form-label">Your message</label>
          <textarea id="userInput" class="form-control" rows="3" placeholder="Type your question here"></textarea>
        </div>
        <div class="col-12 col-lg-4">
          <label for="pdfUpload" class="form-label">Upload PDF</label>
          <input id="pdfUpload" class="form-control" type="file" accept="application/pdf">
        </div>
        <div class="col-12 col-lg-2 d-grid align-self-end">
          <button id="sendButton" type="submit" class="btn btn-primary btn-lg">Send</button>
        </div>
      </form>
      <div id="statusMessage" class="mt-3 text-muted small"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.206/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script>
  const backendUrl = "{{ backend_url }}".trim();
  const chatHistory = document.getElementById('chatHistory');
  const chatForm = document.getElementById('chatForm');
  const userInput = document.getElementById('userInput');
  const pdfUpload = document.getElementById('pdfUpload');

  function appendMessage(content, role) {
    const messageEl = document.createElement('div');
    messageEl.className = `chat-message ${role}`;
    messageEl.textContent = content;
    chatHistory.appendChild(messageEl);
    chatHistory.scrollTop = chatHistory.scrollHeight;
  }

  chatForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const message = userInput.value.trim();
    if (!message && !pdfUpload.files.length) return;

    appendMessage(message || 'Sent PDF', 'user');
    userInput.value = '';

    let formData = new FormData();
    formData.append("message", message);
    if (pdfUpload.files.length) formData.append("file", pdfUpload.files[0]);

    try {
      const response = await fetch(`${backendUrl}/chat`, { method: "POST", body: formData });
      const data = await response.json();
      appendMessage(data.reply || 'Backend replied.', 'bot');
    } catch {
      appendMessage('Error: unable to contact backend.', 'bot');
    }
  });
  </script>
</body>
</html>
