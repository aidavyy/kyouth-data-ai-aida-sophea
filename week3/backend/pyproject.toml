[project]
name = "kyouth-week3-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
	"fastapi",
	"jinja2",
	"pydantic",
	"python-dotenv",
	"ruff>=0.15.14",
	"uvicorn[standard]>=0.23.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


